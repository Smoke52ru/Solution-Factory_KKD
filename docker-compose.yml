services:
  backend:
    build:
      context: ./backend
    container_name: kkd-backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        # Пусто — относительные пути /api, их проксирует nginx на API_UPSTREAM
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: kkd-frontend
    ports:
      - "8080:80"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
